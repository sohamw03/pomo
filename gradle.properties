# Required: the app is built entirely on AndroidX (Compose, DataStore, Lifecycle).
# Without this the build fails at :app:checkDebugAarMetadata.
android.useAndroidX=true

# Per-module R classes instead of one giant merged one.
android.nonTransitiveRClass=true

# Jetifier is deliberately off: there are no legacy support-library artifacts
# in this project, so rewriting them would only slow the build down.
android.enableJetifier=false

# Compose + Kotlin compilation is memory hungry. The Codespace build machine has
# 8 GB, so give the daemon room but stay clear of swapping.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
